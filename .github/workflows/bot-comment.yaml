# Posts pull request, issue and review comments as this org's Agent App, for
# `a-novel core bot-comment`. An operator dispatches it with their own gh token.
# The App key is a secret of this repository's governance environment, so it
# never reaches a dev machine.
#
# The job mints a token scoped to the target repository, with issues and pull
# requests write only, so it cannot push, merge, release or change settings.
# Those permissions could still author or edit a pull request or issue. The job
# only posts comments, and the governance environment admits only the default
# branch's copy, so a compromised trigger can ask for comments and nothing more.
#
# Each org hosts its own copy, because each org has its own Agent App: a-novel's
# lives in a-novel/.github and a-novel-kit's in a-novel-kit/stack. The workflow
# derives the org from github.repository_owner. Keep the two copies identical.

name: bot-comment

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Target repo name within this org (no owner/ prefix)"
        required: true
      nonce:
        description: "Client-generated id, for run correlation + idempotency"
        required: true
      # The single-comment form applies only when `comments` is empty.
      number:
        # Issues and pull requests share one number sequence per repo, so a
        # number names exactly one of them.
        description: "PR or issue number (single-comment form)"
        required: false
        default: ""
      body:
        description: "Markdown comment body (single-comment form)"
        required: false
        default: ""
      reply_to:
        description: "Inline review-comment ID to reply to (single form; empty = top-level)"
        required: false
        default: ""
      # A non-empty batch supersedes the single-comment inputs.
      comments:
        description: "JSON array of {number, body, reply_to?} (batch form)"
        required: false
        default: ""

# The run name carries the nonce, so `a-novel core bot-comment` finds the run
# it dispatched and watches it.
run-name: "bot-comment ${{ github.repository_owner }}/${{ inputs.repo }} (${{ inputs.nonce }})"

# Same-nonce dispatches run one at a time, so two runs never race past the
# idempotency check into a double post. Distinct dispatches carry distinct
# nonces and run in parallel.
concurrency:
  group: bot-comment-${{ inputs.repo }}-${{ inputs.nonce }}
  cancel-in-progress: false

# Every write uses the scoped App token, so the workflow token gets nothing.
permissions: {}

jobs:
  comment:
    runs-on: ubuntu-latest
    # The privileged keys are secrets of the governance environment, which no feature branch opens.
    environment:
      name: governance
      deployment: false
    steps:
      # Validate before minting a token, so a malformed manual dispatch fails
      # early. The checks cover what the GitHub API cannot report meaningfully:
      # the token's repository scope, the nonce format and the batch shape. The
      # API reports per-comment errors at post time, so the rules never drift
      # from GitHub's. A malformed batch may post partially, and a re-dispatch
      # posts the rest, since the markers skip what already landed.
      - name: Validate inputs
        env:
          REPO: ${{ inputs.repo }}
          NONCE: ${{ inputs.nonce }}
          COMMENTS: ${{ inputs.comments }}
        run: |
          set -euo pipefail
          if [ -z "$REPO" ]; then
            echo "::error::repo is empty"
            exit 1
          fi
          case "$REPO" in
            */*)
              echo "::error::repo '$REPO' must be a bare repo name, no owner/ prefix"
              exit 1
              ;;
          esac
          # The CLI encodes the nonce as lowercase hex. The API never sees it:
          # the nonce only appears in markers and the run name.
          case "$NONCE" in
            '' | *[!0-9a-f]*)
              echo "::error::nonce '$NONCE' must be lowercase hex"
              exit 1
              ;;
          esac
          # The post loop's jq needs a non-empty array and fails cryptically on
          # anything else.
          if [ -n "$COMMENTS" ] && ! printf '%s' "$COMMENTS" | jq -e 'type == "array" and length > 0' >/dev/null 2>&1; then
            echo "::error::comments must be a non-empty JSON array"
            exit 1
          fi

      # The App is installed org-wide, and the token still reaches only the
      # target repository. The owner and the key both come from the host org,
      # so this copy acts only within its own org.
      - name: Mint scoped bot token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.repo }}
          permission-issues: write
          permission-pull-requests: write

      - name: Post comments
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ inputs.repo }}
          NONCE: ${{ inputs.nonce }}
          NUMBER: ${{ inputs.number }}
          BODY: ${{ inputs.body }}
          REPLY_TO: ${{ inputs.reply_to }}
          COMMENTS: ${{ inputs.comments }}
        run: |
          set -euo pipefail
          slug="${OWNER}/${REPO}"

          # The single-comment form becomes a one-item batch, so the loop below
          # is the only post path.
          if [ -n "$COMMENTS" ]; then
            items="$COMMENTS"
          else
            items=$(jq -cn --arg n "$NUMBER" --arg b "$BODY" --arg r "$REPLY_TO" \
              '[{number: $n, body: $b, reply_to: $r}]')
          fi

          # Each marker carries nonce:index, and the same array yields the same
          # markers, so a retried run skips every comment that already landed.
          # Each thread is listed once per run. A comment this run posts carries
          # a marker no other item looks for, so that first listing answers
          # every item of the thread.
          declare -A listings=()
          idx=0
          while IFS= read -r item; do
            number=$(printf '%s' "$item" | jq -r '.number')
            body=$(printf '%s' "$item" | jq -r '.body')
            reply_to=$(printf '%s' "$item" | jq -r '.reply_to // ""')
            marker="<!-- bot-comment:${NONCE}:${idx} -->"
            full_body="${body}"$'\n\n'"${marker}"

            # A reply_to answers an inline review thread, which only a pull
            # request has. Without one, the issues endpoint posts a top-level
            # comment on either kind, since a pull request is an issue.
            if [ -n "$reply_to" ]; then
              list_url="repos/${slug}/pulls/${number}/comments"
              post_url="repos/${slug}/pulls/${number}/comments/${reply_to}/replies"
            else
              list_url="repos/${slug}/issues/${number}/comments"
              post_url="repos/${slug}/issues/${number}/comments"
            fi

            # --paginate prints one array per page, and jq reads each in turn.
            if [ -z "${listings[$list_url]:-}" ]; then
              listings[$list_url]=$(mktemp)
              gh api "$list_url" --paginate > "${listings[$list_url]}"
            fi
            existing=$(jq -r --arg marker "$marker" \
              '[.[] | select(.body | contains($marker)) | .html_url] | .[0] // empty' "${listings[$list_url]}")

            if [ -n "$existing" ]; then
              echo "already posted (idempotent): $existing" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              url=$(gh api --method POST "$post_url" -f body="$full_body" --jq .html_url)
              echo "posted: $url" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            idx=$((idx + 1))
          done < <(printf '%s' "$items" | jq -c '.[]')
