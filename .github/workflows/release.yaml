name: release

# Releases are cut from the GitHub UI (Actions ▸ release ▸ pick a type ▸ Run) or
# by the release train, through workflow_call's identical inputs. `plan`
# rehearses with no credential; `cut` runs in the protected `release` environment,
# the "who can publish" gate whose key only it reads, and pushes the version
# commit, the tags and the GitHub Release as the release App.
#
# The CLI's Go module lives under cli/, so release-core derives the cli/vX.Y.Z
# tag prefix from go.mod automatically; the release name, the tag, and the
# version `go install` records all stay one value.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump to cut
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: Bump & report only — no commit, tag, push, or release
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_type:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

run-name: "🚀 release ${{ inputs.release_type }}${{ inputs.dry_run && ' (dry-run)' || '' }}"

# No concurrency lock, on purpose: two simultaneous releases compute the same
# tag, the first push wins, and the second fails on the atomic push before
# anything ships. A queue would instead let the second cut a second release.

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/publish-actions/release-core@v1.79.0
        with:
          # renovate: datasource=go depName=github.com/a-novel-kit/stack/cli
          cli_version: "1.7.5"
          release_type: ${{ inputs.release_type }}
          dry_run: "true"

  cut:
    needs: [plan]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/publish-actions/release-core@v1.79.0
        with:
          # renovate: datasource=go depName=github.com/a-novel-kit/stack/cli
          cli_version: "1.7.5"
          release_type: ${{ inputs.release_type }}
          client_id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  # Everything on the default branch just shipped: clear this repo's awaiting-release items off
  # the board. The Agent key is a secret of the governance environment, never of the release one.
  archive:
    needs: [cut]
    runs-on: ubuntu-latest
    environment:
      name: governance
      deployment: false
    permissions: {}
    steps:
      - uses: a-novel-kit/workflows/generic-actions/archive-board-items@v1.79.0
        with:
          client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
          project_id: ${{ github.repository_owner == 'a-novel' && 'PVT_kwDOB9MxdM4BMh8r' || 'PVT_kwDOCy-nAM4BbtKH' }}
