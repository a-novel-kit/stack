name: release

# Fires when `a-novel publish version` pushes a release tag. The CLI's Go
# module lives under cli/, so its tags are prefixed — cli/vX.Y.Z — which the
# "**" pattern matches (a single "*" would not span the slash). auto-release
# creates the GitHub Release from the tag, so the release name, the git tag,
# and the version `go install` records all stay one value.
on:
  push:
    tags:
      - "**"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: a-novel-kit/workflows/publish-actions/auto-release@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
