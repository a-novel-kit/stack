name: merge-gate
# Stage-4 landing coordinator — SPIKE caller, pins @master for pre-release validation.
# Posts the merge-gate check and enables auto-merge on epic members so a set lands together.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: a-novel-kit/workflows/generic-actions/merge-gate@master
        with:
          client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}

  auto-merge:
    # Enable auto-merge on an epic member so it lands once its gate + approval go green.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Is this an epic member?
        id: m
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if printf '%s' "$LABELS" | grep -qE '"epic:[0-9]+"'; then
            echo "member=true" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.m.outputs.member == 'true' }}
        uses: a-novel-kit/workflows/generic-actions/enable-auto-merge@master
        with:
          pull_request_number: ${{ github.event.pull_request.number }}
          client_id: ${{ vars.AGENT_BOT_CLIENT_ID }}
          app_private_key: ${{ secrets.AGENT_BOT_PRIVATE_KEY }}
          dry_run: "false"
