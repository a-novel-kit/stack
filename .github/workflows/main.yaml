name: main

on:
  push:
    tags-ignore:
      - "**"
    branches:
      - "**"

jobs:
  lint-go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Go module lives under cli/, not the repo root — working-directory is
      # honoured by the shared action (a-novel-kit/workflows#140).
      - uses: a-novel-kit/workflows/go-actions/lint-go@master
        with:
          working-directory: cli

  lint-node:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/lint-node@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          app_private_key: ${{ secrets.DEPENDENCY_BOT_PRIVATE_KEY }}
          app_id: ${{ vars.DEPENDENCY_BOT_ID }}
