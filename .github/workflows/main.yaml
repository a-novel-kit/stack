name: main

on:
  push:
    tags-ignore:
      - "**"
    branches:
      - "**"

jobs:
  generated-go-cli:
    # Ensures `go generate ./...` in cli/ produces no diff against the
    # committed proto bindings, like the per-service generated-go job.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/go-actions/generate-go@v1.67.0
        with:
          working_directory: cli
          failure_message: cli/ go generate definitions are not up-to-date, please run 'go generate ./...' inside cli/ and commit the changes

  lint-proto-cli:
    # buf build, lint and format check over the cli/proto contract. buf-action
    # runs lint and format by default only on pull_request events, which this
    # workflow never runs on. The CLI and its daemon ship in one binary, so the
    # breaking check stays off.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3 # v1
        with:
          input: cli
          lint: true
          format: true

  lint-go-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/go-actions/lint-go@v1.67.0
        with:
          working-directory: cli

  lint-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/lint-node@v1.67.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # The developer guide in docs/. VitePress fails the build on a dead internal
  # link, so every branch checks the links; master's build is what publish-docs
  # deploys.
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/build-node@v1.67.0
        with:
          build_action: docs:build
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/.vitepress/dist

  publish-docs:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && success()
    needs: [build-docs]
    # GitHub Pages allows one deployment in flight per site. The group serializes
    # concurrent master runs.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # Structural conventions golangci-lint cannot express.
  lint-semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: a-novel-kit/workflows/security-actions/lint-semgrep@v1.67.0
        with:
          ruleset: none
          # renovate: datasource=docker depName=semgrep/semgrep
          version: "1.182.0"

  # Scans for committed secrets offline, so no hosted service can hold a merge.
  scan-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: a-novel-kit/workflows/security-actions/scan-secrets@v1.67.0
        with:
          config: .gitleaks.toml
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          version: "8.30.1"

  # Audits the workflows, the permissions each job holds included.
  lint-workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: a-novel-kit/workflows/security-actions/lint-workflows@v1.67.0
        with:
          # renovate: datasource=docker depName=ghcr.io/zizmorcore/zizmor
          version: "1.31.1"

  test-go-cli:
    # Go unit tests for the cli/ module. The race detector stays on for the
    # daemon's concurrent code.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/go-actions/test-go@v1.67.0
        with:
          working_directory: cli
          modfile: gotestsum.mod
          test_artifact: gotest
          race: "true"
