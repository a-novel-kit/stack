name: main

on:
  push:
    tags-ignore:
      - "**"
    branches:
      - "**"

jobs:
  generated-go-cli:
    # Ensures `go generate ./...` in cli/ produces no diff against the
    # committed proto bindings, like the per-service generated-go job.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/go-actions/generate-go@v1.66.0
        with:
          working_directory: cli
          failure_message: cli/ go generate definitions are not up-to-date, please run 'go generate ./...' inside cli/ and commit the changes

  lint-proto-cli:
    # buf build over the cli/proto contract, which fails on a contract that does
    # not compile. buf-action lints, checks formatting and checks for breaking
    # changes only on pull_request events, which this workflow never runs on.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: bufbuild/buf-action@v1
        with:
          input: cli

  lint-go-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Go module lives under cli/, not the repo root — working-directory is
      # honoured by the shared action (a-novel-kit/workflows#140).
      - uses: a-novel-kit/workflows/go-actions/lint-go@v1.66.0
        with:
          working-directory: cli

  lint-js:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/lint-node@v1.66.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # The developer guide in docs/. VitePress fails the build on a dead internal
  # link, so every branch checks the links; master's build is what publish-docs
  # deploys.
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: a-novel-kit/workflows/node-actions/build-node@v1.66.0
        with:
          build_action: docs:build
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  publish-docs:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && success()
    needs: [build-docs]
    # GitHub Pages allows one deployment in flight per site. The group serializes
    # concurrent master runs.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Structural conventions golangci-lint cannot express.
  lint-semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: a-novel-kit/workflows/security-actions/lint-semgrep@v1.66.0
        with:
          ruleset: none
          # renovate: datasource=docker depName=semgrep/semgrep
          version: "1.181.0"

  # Replaces GitGuardian, which gated on a hosted service: when it saturated,
  # every PR in the fleet became unmergeable. This runs offline.
  scan-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: a-novel-kit/workflows/security-actions/scan-secrets@v1.66.0
        with:
          config: .gitleaks.toml
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          version: "8.30.1"

  # Replaces CodeQL's actions analysis: excessive-permissions is the class it
  # reported as actions/missing-workflow-permissions.
  lint-workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: a-novel-kit/workflows/security-actions/lint-workflows@v1.66.0
        with:
          # renovate: datasource=docker depName=ghcr.io/zizmorcore/zizmor
          version: "1.31.1"

  test-go-cli:
    # Go unit tests for the cli/ module. The race detector stays on for the
    # daemon's concurrent code.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: a-novel-kit/workflows/go-actions/test-go@v1.66.0
        with:
          working_directory: cli
          modfile: gotestsum.mod
          test_artifact: gotest
          race: "true"
