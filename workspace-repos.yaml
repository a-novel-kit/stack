# The repositories `a-novel core sync` clones and fast-forwards. The CLI reads
# this file on each run, so an edit needs no rebuild. Without it, `core sync`
# has nothing to do.
#
# Each entry is "<org>/<repo>", and the org picks the directory:
#   a-novel-kit/<repo> → kit/<repo>   (libraries and CI actions)
#   a-novel/<repo>     → app/<repo>   (services, platforms and infra)
repos:
  - a-novel-kit/.github
  - a-novel-kit/golib
  - a-novel-kit/nodelib
  - a-novel-kit/jwt
  - a-novel-kit/uikit
  - a-novel-kit/ui-assets
  - a-novel-kit/workflows
  - a-novel/.github
  - a-novel/infra
  - a-novel/service-template
  - a-novel/platform-template
  - a-novel/platform-studio
  - a-novel/platform-account
  - a-novel/service-json-keys
  - a-novel/service-authentication
  - a-novel/service-narrative-engine
  - a-novel/service-genai
