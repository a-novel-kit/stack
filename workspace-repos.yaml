# Curated set of a-novel / a-novel-kit repositories that `a-novel core sync`
# clones and fast-forwards into app/ and kit/. This file is the single source
# of truth: the CLI reads it at runtime, so edit it freely — no rebuild needed.
# If it is absent, `core sync` has nothing to do.
#
# Each entry is "<org>/<repo>". The org selects the target sub-directory:
#   a-novel-kit/<repo> → kit/<repo>   (shared libraries)
#   a-novel/<repo>     → app/<repo>   (services)
repos:
  - a-novel-kit/.github
  - a-novel-kit/golib
  - a-novel-kit/nodelib
  - a-novel-kit/jwt
  - a-novel-kit/workflows
  - a-novel/.github
  - a-novel/service-template
  - a-novel/service-json-keys
  - a-novel/service-authentication
  - a-novel/service-narrative-engine
  - a-novel/service-jobs
