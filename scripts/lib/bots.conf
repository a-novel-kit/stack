# scripts/lib/bots.conf
#
# Public GitHub App identifiers for the bots used to attribute automated
# comments to <app-slug>[bot] instead of a human collaborator.
#
# These IDs are NOT secrets — App ID and Installation ID are visible in any
# GitHub App settings URL. The matching private keys (.pem) are loaded from
# $BOT_KEY_DIR (default: <repo-root>/.secrets/, gitignored). Per-org pem file
# names are listed in BOT_KEY_FILES so each key can keep the GitHub-issued
# filename unchanged on disk.
#
# Requires bash 4+ for associative arrays. macOS ships bash 3.2 by default;
# install a newer bash via Homebrew, or rewrite this file as parallel scalars.
#
# Key rotation: when a private key is regenerated on GitHub, the new download
# has a different filename. Either rename the file to match BOT_KEY_FILES or
# update the entry below.

declare -A BOT_APP_IDS=(
	[a-novel]=3549319
	[a-novel-kit]=3549379
)

declare -A BOT_INSTALLATION_IDS=(
	[a-novel]=128231241
	[a-novel-kit]=128232102
)

declare -A BOT_KEY_FILES=(
	[a-novel]=anovelbot-agent.private-key.pem
	[a-novel-kit]=anovelkitbot-agent.private-key.pem
)
