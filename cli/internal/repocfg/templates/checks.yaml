# Semantic check-discovery map. The CLI probes the repo (via the `detect`
# package) and assembles the `master` ruleset's required status checks +
# the CodeQL/Dependabot languages from the signals below. Editing the
# job<->signal mapping here needs no code change.
#
# integration is the GitHub App that posts the check (its id ends up in
# the ruleset's required_status_checks[].integration_id).

integrations:
  actions: 15368
  gitguardian: 46505
  codecov: 254

# Always required, regardless of languages.
always:
  - { context: "GitGuardian Security Checks", integration: gitguardian }

# Language detection -> checks + CodeQL languages + Dependabot ecosystems.
languages:
  go:
    detect: ["go.mod"]
    checks:
      - { context: "lint-go", integration: actions }
      - { context: "generated-go", integration: actions }
      # The Go test job's check context is "test-go" fleet-wide (the shared
      # go-actions/test-go action; stack inlines the same job id). A bare "test"
      # never matches it and would sit "Expected" forever.
      - { context: "test-go", integration: actions }
    codeql: ["go"]
  node:
    detect: ["package.json"]
    checks:
      - { context: "lint-node", integration: actions }
    codeql: ["javascript-typescript"]
  proto:
    detect: ["buf.yaml", "buf.gen.yaml"]
    checks:
      - { context: "lint-proto", integration: actions }
  actions:
    detect: [".github/workflows"]
    codeql: ["actions"]

# Sub-feature detection (more specific than language).
features:
  pkg-js:
    detect: ["pkg/js"]
    checks:
      - { context: "generated-pnpm", integration: actions }
      - { context: "test-pkg-js", integration: actions }
      - { context: "build-js", integration: actions }

# Docker/compose build targets -> one build-<target> check per detected
# target (target names come from detect.Detect, e.g. rest, migrations,
# database, standalone-rest). NOTE: some CI build jobs are hand-named and do
# NOT match this derivation (init.Dockerfile -> the job "build-job-init", not
# "build-init"). Those contexts are "unmanaged": `repo update` preserves a live
# one rather than reconciling it away (only `--full` drops it). See IsManaged.
docker:
  context_format: "build-%s"
  integration: actions

# Presence of tests (detect.DetectTests) -> enable the codecov ruleset.
codecov:
  enable_when_tests: true
  checks:
    - { context: "codecov/patch", integration: codecov }
    - { context: "codecov/project", integration: codecov }

# Retired check contexts: names this map once emitted but has since renamed or
# removed. They stay part of the managed namespace so a normal `repo update`
# DROPS a stale live check by one of these names (instead of preserving it as a
# manual one). Add an OLD name here ONLY when it is unambiguous fleet-wide.
#
# `test` is deliberately NOT retired: it is overloaded. Go repos use it for the
# Go test job (which should be renamed to `test-go`, matching lint-go /
# generated-go), but nodelib uses `test` for its JS (vitest) gate — retiring it
# would drop nodelib's real check. A Go repo migrates by renaming its CI job
# `test` -> `test-go`, then running `repo update --full` to drop the old name.
retired: []
