# Required-status-check discovery for the master ruleset.
#
# Required checks = the `always` set + every job declared in a repo's
# .github/workflows/main.yaml, MINUS the `exclude` rules below. A job's id IS
# its check context, so there is nothing to derive and nothing to drift.
# Workflow files are code (owned by skills / PRs), not by `repo update`; this
# map only decides which of their jobs gate the default branch.

integrations:
  actions: 15368
  gitguardian: 46505
  codecov: 254
  # [Agent] App (id 3549379) — posts the merge-gate check-run via the Checks API.
  agent: 3549379

# Always required, regardless of repo or class.
always:
  - { context: "GitGuardian Security Checks", integration: gitguardian }
  # merge-gate (a-novel-kit/.github#50): the single "may this PR merge?" gate,
  # posted by the [Agent] App (stable integration across stages) from the
  # merge-gate.yaml workflow — hence integration `agent`, not `actions`. Stage-2
  # skeleton always passes; the epic-atomicity / draft-review logic lands in
  # Stage 3 without changing this entry.
  - { context: "merge-gate", integration: agent }

# main.yaml jobs are required by default, except those matching these rules:
exclude:
  # Job ids starting with one of these prefixes (reporting / post-merge jobs).
  prefixes: ["report-"]
  # Jobs whose `if:` contains one of these strings — master-only jobs never run
  # on a PR, so they cannot gate one.
  if_contains: ["github.ref == 'refs/heads/master'"]

# CodeQL languages for the codeql.yml workflow (rendered by repo create/update).
# This is the only file-based detection that remains: an always-on language
# needs no signal; the rest are keyed to a canonical file.
codeql:
  always: ["actions"]
  languages:
    - { detect: ["go.mod"], lang: "go" }
    - { detect: ["package.json"], lang: "javascript-typescript" }

# The codecov ruleset's checks. Codecov posts these statuses itself (they are
# not main.yaml jobs), so they live in a separate ruleset that bots bypass.
codecov:
  enable_when_tests: true
  checks:
    - { context: "codecov/patch", integration: codecov }
    - { context: "codecov/project", integration: codecov }
