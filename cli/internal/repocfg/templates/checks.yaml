# Required-status-check discovery for the master ruleset.
#
# Required checks are the `always` set plus every job declared in a repo's
# .github/workflows/main.yaml, minus the `exclude` rules below. A job's ID is
# its check context. Workflow files are code, owned by PRs; this map only
# decides which of their jobs gate the default branch.

integrations:
  actions: 15368
  # The [Agent] App posts the merge-gate check-run, and its ID is per-org
  # (a-novel and a-novel-kit run separate Apps), so `agent` is injected from
  # the org profile at discovery time. See ResolveBotIntegrations.

# Always required, regardless of repo or class.
#
# GitGuardian was here and is deliberately gone. It is a hosted service on the
# merge path: when it saturated on 2026-07-23 it fell to roughly one scan a
# minute against a fleet opening 144 PRs a day, and because a required check
# that never arrives has no timeout, every affected PR became permanently
# unmergeable. Secret scanning now runs in CI as the `scan-secrets` job, which
# main.yaml declares and this map discovers automatically — no `always` entry
# needed, and nothing off-repo can stall it.
always:
  # merge-gate: the single "may this PR merge?" gate, posted by the [Agent] App
  # from the merge-gate.yaml workflow.
  - { context: "merge-gate", integration: agent }
  # epic-freeze: the partial-landing detector's check. It succeeds by default
  # and fails on a PR whose Epic landed partially, posted by the [Agent] App
  # from epic-freeze.yaml and the sweep.
  - { context: "epic-freeze", integration: agent }

# main.yaml jobs are required by default, except those matching these rules:
exclude:
  # Job IDs starting with one of these prefixes (reporting / post-merge jobs).
  prefixes: ["report-"]
  # Jobs whose `if:` contains one of these strings — master-only jobs never run
  # on a PR, so they cannot gate one.
  if_contains: ["github.ref == 'refs/heads/master'"]
