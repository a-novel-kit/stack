# Repo-specific config for a-novel-kit/uikit: the library class with Pages on,
# where its Storybook deploys. A repos/<org>_<repo>.yaml file fully replaces
# the class for that repo.
class: library
features:
  issues: true
  wiki: false
  projects: true
  discussions: true
  pull_requests: collaborators_only
merge:
  squash: true
  merge_commit: false
  rebase: false
  auto_merge: true
  delete_branch_on_merge: true
  allow_update_branch: true
  signoff_required: true
security:
  secret_scanning: true
  push_protection: true
  dependabot: true
pages: true
code_quality: false
clean_images: false
rulesets:
  master: true
  require_approval: true
  tags: true
