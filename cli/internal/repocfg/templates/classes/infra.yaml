# Public, deployment-only infrastructure. OpenTofu source and operational
# documentation live here, but releases and tags do not: deployments are the
# delivery unit. Required CI checks are discovered once their workflows land.
class: infra
features:
  issues: true
  wiki: false
  projects: true
  discussions: false
  pull_requests: collaborators_only
merge:
  squash: true
  merge_commit: false
  rebase: false
  auto_merge: true
  delete_branch_on_merge: true
  allow_update_branch: true
  signoff_required: true
security:
  secret_scanning: true
  push_protection: true
  # Renovate owns dependency updates; Dependabot still provides vulnerability
  # alerts without opening a second stream of update pull requests.
  dependabot: false
  dependabot_alerts: true
pages: false
code_quality: false
rulesets:
  master: true
  require_approval: true
  tags: false
  # A merge to master deploys production, and every bot reaches master through
  # a pull request. Bot keys are org secrets that any repository's workflows can
  # read, so letting a bot bypass would let any of them deploy.
  admins_only: true
