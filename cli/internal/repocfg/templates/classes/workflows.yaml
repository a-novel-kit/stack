# Reusable GitHub Actions workflows (a-novel-kit): workflows.
class: workflows
features: { issues: true, wiki: false, projects: true, discussions: false }
merge:
  squash: true
  merge_commit: false
  rebase: false
  auto_merge: true
  delete_branch_on_merge: true
  allow_update_branch: true
  signoff_required: true
security: { secret_scanning: true, push_protection: true, dependabot: true }
codeql: { enabled: true, query_suite: default } # actions scanning only (discovered)
pages: false
codecov: disabled
code_quality: false # not a code repo
rulesets: { master: true, require_approval: true }
