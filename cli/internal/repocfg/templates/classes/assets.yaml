# Private assets repo (a-novel-kit): assets. Branding, no code.
#
# Private + Free plan => rulesets and GHAS are unavailable (the API 403s).
# This class applies generic settings only; security/codeql/pages/rulesets
# modules are skipped with a "plan-limited" note rather than erroring.
class: assets
private: true
features: { issues: true, wiki: false, projects: true, discussions: false }
merge:
  squash: true
  merge_commit: false
  rebase: false
  auto_merge: true
  delete_branch_on_merge: true
  allow_update_branch: true
  signoff_required: true
security: { secret_scanning: false, push_protection: false, dependabot: false }
codeql: { enabled: false }
pages: false
codecov: disabled
code_quality: false
rulesets: { master: false, require_approval: false }
