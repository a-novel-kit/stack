# Shared library, with the language detected from the repo. Covers golib, jwt
# and nodelib: their config is identical, only the discovered checks differ.
class: library
features:
  issues: true
  wiki: false
  projects: true
  discussions: true
merge:
  squash: true
  merge_commit: false
  rebase: false
  auto_merge: true
  delete_branch_on_merge: true
  allow_update_branch: true
  signoff_required: true
security:
  secret_scanning: true
  push_protection: true
  dependabot: true
codeql:
  enabled: true
  query_suite: security-and-quality
pages: false
code_quality: true
rulesets:
  master: true
  require_approval: true
  tags: true
