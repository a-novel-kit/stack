# Per-org config for a-novel. When a ruleset's bypass list names a generic
# bot (dependencies | agent | publish), the CLI resolves it to the GitHub
# App ID below for this org's repos.
org: a-novel
signing_required: true
bots:
  dependencies: 1717331 # AnovelBot[Dependencies] — Renovate
  agent: 3549319 # AnovelBot[Agent] — PR/issue comment proxy
  release: 5307879 # AnovelBot[Release] — release tags, commits and packages
  publish: 1718144 # AnovelBot[Publish] — release automation
# Org secrets with selected-repository visibility. Each repo can read one
# exactly when one of its workflows names it; every other org secret stays
# visible to all repos. Before a secret is listed here, an admin switches it to
# selected in the org settings, picking the repos that name it, since only that
# switch needs its value. A listed secret still visible to all repos fails each
# grant and revoke with 409.
scoped_secrets:
  - CODECOV_TOKEN
  - PUBLISH_BOT_PRIVATE_KEY
  - TOKEN_EXPIRY_ADMIN
# Privileged secrets, which no org secret carries. Each repo's governance
# environment holds the ones its workflows name, copied by `repo update` from
# this Bitwarden Secrets Manager project, which keys each secret by its GitHub
# name. Rotating one is updating it in Bitwarden, then running `repo update`.
governance:
  bws_project: 329646a4-ae62-41c9-89a3-b4e30048f0c7
  bws_server_url: https://vault.bitwarden.eu
  secrets:
    - AGENT_BOT_PRIVATE_KEY
    - BWS_READ_TOKEN
    - DEPENDENCY_BOT_PRIVATE_KEY
    - PUBLISH_BOT_PRIVATE_KEY
