# Conventional Commits subjects on every commit pushed to any branch. A squash
# merge lands one commit whose subject the repo settings take from the PR title
# and whose body lists the branch's commit messages, so both parts are checked
# before they can land. The merge queue's gh-readonly-queue branches are left
# out: GitHub writes their commits from titles the rule already checked on the
# PR. Dependabot is the only bypass actor, and only on classes that enable its
# security updates; its commits follow the repo's style but are not configured.
# Commit metadata rules need GitHub Enterprise.
#
# The rule is active: GitHub rejects a push, a web commit or a merge that carries
# a non-conforming subject, so `fixup!` commits, merge-based branch updates and
# GitHub's `Revert "…"` button are refused (see the git-conventions skill).
name: commit-messages
target: branch
enforcement: active
conditions:
  ref_name:
    include: ["~ALL"]
    exclude: ["refs/heads/gh-readonly-queue/**"]
bypass:
  - dependabot
rules:
  commit_message_pattern:
    name: Conventional Commits subject
    operator: regex
    pattern: '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: \S'
    negate: false
