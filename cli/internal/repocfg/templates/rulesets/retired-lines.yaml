# Protection for retired lines, the v<N> branches of the majors below the one
# the default branch releases. A major is developed on its v<N> branch until it
# replaces the default branch, and the line it replaces is kept under its own
# v<N> name. A retired line takes no further change.
#
# The CLI fills the include list from the major in the default branch's root
# package.json: v0 to v<major-1>, so a branch developing a coming major stays
# open. Only admins may create, update or delete a retired line, and nobody may
# force-push one. A merge-queue commit matches no bypass actor, so no pull
# request lands on it either.
name: retired-lines
target: branch
enforcement: active
conditions:
  ref_name:
    include: []
    exclude: []
bypass:
  - admins
rules:
  creation: true
  update: true
  deletion: true
  non_fast_forward: true
