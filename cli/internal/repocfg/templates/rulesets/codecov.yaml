# Coverage gate, applied only when codecov is enabled (class codecov:
# enabled, or auto + the repo has tests). The Renovate proxy (dependencies)
# is exempt, so dependency-update PRs are never blocked on coverage. The
# release bots are exempt too: they push the version-bump commit straight to
# the default branch (see the master ruleset), and that push carries no
# coverage status — without this it would be rejected by required_status_checks.
# In the dispatched release flow the AGENT bot is the pusher; publish is kept
# for the legacy tag-push flow during the migration.
name: codecov
target: branch
enforcement: active
conditions:
  ref_name:
    include: ["~DEFAULT_BRANCH"]
    exclude: []
bypass:
  - admins
  - dependencies
  - agent
  - publish
rules:
  required_status_checks:
    strict: false
    do_not_enforce_on_create: false
