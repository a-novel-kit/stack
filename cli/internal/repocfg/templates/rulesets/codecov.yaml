# Coverage gate, applied only when codecov is enabled (class codecov:
# enabled, or auto + the repo has tests). The dependency bots (our Renovate
# proxy and GitHub-native Dependabot) are exempt, so dependency-update PRs
# are never blocked on coverage. The publish bot is exempt too: it pushes
# release commits straight to the default branch (see the master ruleset),
# and that push carries no coverage status — without this it would be
# rejected by required_status_checks.
name: codecov
target: branch
enforcement: active
conditions:
  ref_name:
    include: ["~DEFAULT_BRANCH"]
    exclude: []
bypass:
  - admins
  - dependencies
  - dependabot
  - publish
rules:
  required_status_checks:
    strict: false
    do_not_enforce_on_create: false
