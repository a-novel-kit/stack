# `codecov` ruleset base. Applied only when codecov is enabled (class
# codecov: on, or codecov: auto + the repo has tests). The CLI injects
# bypass_actors <- bypass_always + bypass_bots, and the checks <-
# checks.yaml codecov section.
name: codecov
target: branch
enforcement: active
conditions:
  ref_name:
    include: ["~DEFAULT_BRANCH"]
    exclude: []
rules:
  required_status_checks:
    strict: false
    do_not_enforce_on_create: false
    # checks: injected from checks.yaml (codecov/patch, codecov/project)
