# Release-tag protection, the server-side half of "releases come from CI only".
# Only the agent bot, which cuts releases from the release workflow, and repo
# admins may create, move or delete a tag. A tag — and so a release — therefore
# comes from the release workflow or a deliberate admin override, never a
# developer's `git push origin vX.Y.Z`.
#
# ~ALL covers every tag, not just v*, so no tag of any shape can be hand-pushed.
# The agent bot bypasses with mode "always" for its direct write, resolved by
# the builder like the master ruleset's bots.
name: tags
target: tag
enforcement: active
conditions:
  ref_name:
    include: ["~ALL"]
    exclude: []
bypass:
  - admins
  - agent
rules:
  creation: true
  update: true
  deletion: true
  non_fast_forward: true
