# Mandatory review on the default branch. The dependency bot's pull requests
# are exempt, and the release bot's version-bump commit, pushed directly, must
# pass this rule's pull-request requirement too.
name: require-approval
target: branch
enforcement: active
conditions:
  ref_name:
    include: ["~DEFAULT_BRANCH"]
    exclude: []
bypass:
  - admins
  - dependencies
  - release
rules:
  pull_request:
    allowed_merge_methods: ["squash"]
    required_approving_review_count: 1
    dismiss_stale_reviews_on_push: true
    require_last_push_approval: true
    required_review_thread_resolution: true
    require_code_owner_review: false
