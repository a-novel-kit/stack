# `master` ruleset base. The CLI injects:
#   - bypass_actors  <- orgs/<org>.yaml bypass_always
#   - required_status_checks.checks  <- semantic discovery (checks.yaml)
#   - the code_quality rule  <- only when the class sets code_quality: true
# Everything else here is the editable static policy.
name: master
target: branch
enforcement: active
conditions:
  ref_name:
    include: ["~DEFAULT_BRANCH"]
    exclude: []
rules:
  deletion: true
  non_fast_forward: true
  required_status_checks:
    strict: true
    do_not_enforce_on_create: false
    # checks: injected from discovery
  merge_queue:
    grouping_strategy: ALLGREEN
    merge_method: SQUASH
    check_response_timeout_minutes: 60
    max_entries_to_build: 5
    max_entries_to_merge: 5
    min_entries_to_merge: 1
    min_entries_to_merge_wait_minutes: 5
  code_quality:
    severity: errors # included only when class.code_quality == true
