# Branch protection for the default branch. The CLI injects the required
# status checks from semantic discovery, and omits the code_quality rule
# for classes that set code_quality: false. Admins bypass; the agent bot (which
# cuts releases) and the publish bot also bypass, because the version-bump commit
# lands on the default branch directly (no branch proxy). Every status check is
# required for everyone else.
#
# required_signatures enforces verified commits on the default branch. The merge
# queue squashes, so GitHub validates the signature on the resulting (GitHub-
# signed) squash commit, not the contributor's individual PR commits — merges are
# never blocked on unsigned feature commits. The release bot's direct version-bump
# commit is covered by its bypass above. Renovate already commits via the API
# (signed), so dependency PRs are unaffected.
name: master
target: branch
enforcement: active
conditions:
  ref_name:
    include: ["~DEFAULT_BRANCH"]
    exclude: []
bypass:
  - admins
  - publish
  - agent
rules:
  deletion: true
  non_fast_forward: true
  required_signatures: true
  required_status_checks:
    strict: true
    do_not_enforce_on_create: false
  merge_queue:
    grouping_strategy: ALLGREEN
    merge_method: SQUASH
    check_response_timeout_minutes: 60
    max_entries_to_build: 5
    max_entries_to_merge: 5
    min_entries_to_merge: 1
    min_entries_to_merge_wait_minutes: 5
  code_quality:
    severity: errors
