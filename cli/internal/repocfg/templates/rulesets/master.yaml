# Branch protection for the default branch. The CLI injects the required status
# checks from discovery, and omits the code_quality rule for classes that set
# code_quality: false. Admins bypass, as do the agent bot (which cuts releases)
# and the publish bot, whose version-bump commit lands on the default branch
# directly. Every status check is required for everyone else.
#
# required_signatures enforces verified commits on the default branch. The merge
# queue squashes, so GitHub validates the signature on the resulting
# GitHub-signed squash commit, and an unsigned feature commit never blocks a
# merge. The release bot's direct version-bump commit is covered by its bypass
# above, and Renovate commits through the API, already signed.
name: master
target: branch
enforcement: active
conditions:
  ref_name:
    include: ["~DEFAULT_BRANCH"]
    exclude: []
bypass:
  - admins
  - publish
  - agent
rules:
  deletion: true
  non_fast_forward: true
  required_signatures: true
  required_status_checks:
    strict: true
    do_not_enforce_on_create: false
  merge_queue:
    grouping_strategy: ALLGREEN
    merge_method: SQUASH
    # How long the queue waits on a required check that never reports before it
    # drops the entry. A check can go missing without failing — a third party
    # that accepts an upload and never posts its status leaves the group pending
    # with every other check green — and until the timeout expires it blocks
    # every PR queued behind it. Merge-group CI measures 1-5 minutes across the
    # governed repos, so 15 clears the slowest run threefold while capping a
    # stall at a quarter hour. Only raise it against a fresh measurement of the
    # slowest lane.
    check_response_timeout_minutes: 15
    max_entries_to_build: 5
    max_entries_to_merge: 5
    min_entries_to_merge: 1
    min_entries_to_merge_wait_minutes: 5
  code_quality:
    severity: errors
