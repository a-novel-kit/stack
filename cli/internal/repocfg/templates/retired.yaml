# Governance a previous version of repocfg installed, and this one must actively REMOVE.
#
# Deleting a template only stops `repo update` from MANAGING a thing — whatever is already
# live keeps enforcing, unattended and unreviewed. Apply deliberately never removes what it
# was not told about, because governed repos also carry rulesets and labels that are not
# ours to touch. Retirement is therefore explicit, exactly as it is for labels.
#
# An entry is safe to leave here forever: deleting an already-absent ruleset is a no-op, so
# the list is a standing assertion rather than a one-shot migration. Only drop an entry once
# every governed repo has certainly been reconciled since it was added.
rulesets:
  # codecov required the coverage statuses (codecov/patch, codecov/project) on the default
  # branch, exempting the bot Apps so dependency PRs were never blocked on coverage.
  #
  # That exemption could not hold. A ruleset bypass answers "who may merge this PULL
  # REQUEST?", but the merge queue validates required checks against a merge GROUP — a
  # temporary ref with no author for any bypass to match. So the moment a dependency PR was
  # queued, coverage became mandatory again; and a coverage provider that accepted an upload
  # without ever posting its status left the group pending behind an otherwise entirely green
  # build, blocking every PR behind it until the queue timed out. GitHub offers no way to
  # scope a required status check to pull requests only, so the gate had to go.
  #
  # Coverage itself is unchanged and still measured: the upload job still runs, the report
  # still lands on the PR, and each repo's codecov.yml still sets its targets. It is now
  # advisory — it informs a review instead of blocking a merge.
  - codecov
