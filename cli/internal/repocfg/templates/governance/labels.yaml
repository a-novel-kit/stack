# Canonical issue/PR label set, provisioned uniformly to every repo like
# governance/CODEOWNERS. `ensure` labels are upserted — created, or recolored and
# re-described to match — and `retire` labels are deleted. A label listed in
# neither is left untouched, so apply never removes an unlisted label.
#
# Labels here are cross-cutting signals that sort work within a board status. The
# kind of an issue (Epic / Feature / Task / Bug / Initiative) is its issue type,
# and Priority and Size are project fields.
ensure:
  - name: documentation
    color: "0075ca"
    description: Improvements or additions to documentation
  - name: duplicate
    color: "cfd3d7"
    description: This issue or pull request already exists
  - name: good first issue
    color: "7057ff"
    description: Good for newcomers
  - name: help wanted
    color: "008672"
    description: Extra attention is needed
  - name: invalid
    color: "e4e669"
    description: This doesn't seem right
  - name: question
    color: "d876e3"
    description: Further information is requested
  - name: wontfix
    color: "ffffff"
    description: This will not be worked on
  - name: dependencies
    color: "ededed"
    description: ""
  - name: renovate
    color: "ededed"
    description: ""
  - name: meta
    color: "bfd4f2"
    description: No-PR work (manual ops / config); also marks Meta Epics
  - name: append-only-override
    color: "fbca04"
    description: Allows a reviewed change to files protected by an append-only CI check
  # automation:paused — on an Epic issue, holds that one epic's [Agent] automation:
  # merge-gate holds its members, and the partial-landing detector and rollback skip
  # it, while other epics keep moving. It is best-effort: a label-read blip fails
  # open and the pause is skipped that pass, so the org kill-switch
  # (vars.AGENT_KILL_SWITCH) is the hard, read-free halt. GitHub caps a label
  # `description` at 100 chars, so the field below is the short form and this comment
  # carries the rest; a longer description 422s the label reconcile for every repo.
  - name: "automation:paused"
    color: "d93f0b"
    description: "Pauses this Epic's [Agent] automation (best-effort; org kill-switch is the hard halt)"
  # escalation — the umbrella label the escalate action puts on every escalation
  # ticket, so humans get one board filter for all open escalations. The color and
  # description match the escalate action's own `gh label create --force`
  # (generic-actions/escalate), so the two never recolor each other.
  - name: escalation
    color: "b60205"
    description: "Automated governance escalation (escalate action)."
  # hotfix-reconcile — on a hotfix's per-hotfix cleanup Task: the fix is forward-ported to the
  # default branch, so every later minor carries it. Matches hotfix.yaml's own ensure.
  - name: hotfix-reconcile
    color: "fbca04"
    description: "Tracks a hotfix's forward-port to the default branch."
retire:
  # Replaced by the `Triage` board status: a status is the action a task needs;
  # labels only sort within a status.
  - triage
