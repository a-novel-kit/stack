# Canonical issue/PR label set, provisioned uniformly to every repo like
# governance/CODEOWNERS. `ensure` labels are upserted — created, or recolored and
# re-described to match — and `retire` labels are deleted. A label listed in
# neither is left untouched, so apply never removes an unlisted label.
#
# Labels here are cross-cutting signals that sort work within a board status. The
# kind of an issue (Epic / Feature / Task / Bug / Initiative) is its issue type,
# and Priority and Size are project fields.
ensure:
  - name: documentation
    color: "0075ca"
    description: Improvements or additions to documentation
  - name: duplicate
    color: "cfd3d7"
    description: This issue or pull request already exists
  - name: good first issue
    color: "7057ff"
    description: Good for newcomers
  - name: help wanted
    color: "008672"
    description: Extra attention is needed
  - name: invalid
    color: "e4e669"
    description: This doesn't seem right
  - name: question
    color: "d876e3"
    description: Further information is requested
  - name: wontfix
    color: "ffffff"
    description: This will not be worked on
  # Dependabot labels its own pull requests with it.
  - name: dependencies
    color: "ededed"
    description: ""
  - name: meta
    color: "bfd4f2"
    description: No-PR work (manual ops / config); also marks Meta Epics
  - name: append-only-override
    color: "fbca04"
    description: Allows a reviewed change to files protected by an append-only CI check
  - name: allow-dependency-change
    color: "fbca04"
    description: A reviewer acknowledges the dependency manifests this pull request changes
  - name: allow-screenshot-change
    color: "c5def5"
    description: Approve visual changes for the reviewed PR head; functional tests remain required
  - name: allow-incomplete-translations
    color: "fbca04"
    description: Accepts translations this PR leaves empty; they render the English text
  - name: allow-translation-drift
    color: "fbca04"
    description: Accepts English changes whose translations this PR leaves unchanged
  # bufbuild/buf-action skips its breaking-change check on a pull request carrying this exact
  # name, so an intended break lands through review instead of an admin override.
  - name: buf skip breaking
    color: "fbca04"
    description: A reviewer accepts the breaking proto change this pull request makes
  - name: with-feature-env
    color: "0e8a16"
    description: Tags this pull request's images for its current head; a push removes it
  # automation:paused — on an Epic issue, holds that one epic's [Agent] automation:
  # merge-gate holds its members, and the partial-landing detector and rollback skip
  # it, while other epics keep moving. It is best-effort: a label-read blip fails
  # open and the pause is skipped that pass, so the org kill-switch
  # (vars.AGENT_KILL_SWITCH) is the hard, read-free halt. GitHub caps a label
  # `description` at 100 chars, so the field below is the short form and this comment
  # carries the rest; a longer description 422s the label reconcile for every repo.
  - name: "automation:paused"
    color: "d93f0b"
    description: "Pauses this Epic's [Agent] automation (best-effort; org kill-switch is the hard halt)"
  # escalation — the umbrella label the escalate action puts on every escalation
  # ticket, so humans get one board filter for all open escalations. The color and
  # description match the escalate action's own `gh label create --force`
  # (generic-actions/escalate), so the two never recolor each other.
  - name: escalation
    color: "b60205"
    description: "Automated governance escalation (escalate action)."
retire:
  # Replaced by the `Triage` board status: a status is the action a task needs;
  # labels only sort within a status.
  - triage
  # Marked a hotfix's forward-port Task. Hotfixes now land on the default branch
  # first and are backported, so nothing forward-ports.
  - hotfix-reconcile
  # Marked Renovate's pull requests. Renovate no longer labels them: each label
  # started another main run, and a cancelled one stranded a-novel/infra#857.
  - renovate
