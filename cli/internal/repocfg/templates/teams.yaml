# Contributor tiers. Each tier is an org team whose only repository grant is
# Write on the org's bot-comment dispatcher, so every member can post bot
# comments. Under it, `repo update` keeps one area team per repository class, named
# `<tier>-<class>`, which holds the tier's role on every repository of that
# class. A person joins the area teams they work in; membership is managed in
# GitHub. Core holds Admin on every repository through its org role and is not a
# tier.
#
# The reconcile owns only these teams: it creates them, grants each repository
# its area teams, and removes a grant any other tier team holds there. Teams
# outside the tiers are left untouched, as labels outside labels.yaml are.
tiers:
  # Push branches, open pull requests and arm auto-merge. review-gate holds a
  # merge until a maintainer approves.
  - name: developers
    permission: push
  # Triage, manage labels and approve the pull requests that merge.
  - name: maintainers
    permission: maintain
  # Admin on their area's repositories: core's rights there, ruleset bypass included.
  - name: owners
    permission: admin
