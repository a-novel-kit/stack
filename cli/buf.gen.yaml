version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/a-novel-kit/stack/cli/proto/gen
plugins:
  - remote: buf.build/protocolbuffers/go
    out: proto/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: proto/gen
    opt: paths=source_relative
inputs:
  - directory: proto
